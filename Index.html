<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lagerbestand App</title>

<style>
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        background: radial-gradient(circle at top, #0f172a, #020617);
        color: #e2e8f0;
    }

    .container {
        max-width: 720px;
        margin: auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        font-size: 32px;
        margin-bottom: 5px;
    }

    .subtitle {
        text-align: center;
        opacity: 0.7;
        margin-bottom: 20px;
    }

    .card {
        background: rgba(255,255,255,0.06);
        backdrop-filter: blur(12px);
        border-radius: 18px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 6px 0;
        border-radius: 10px;
        border: none;
        outline: none;
        background: rgba(255,255,255,0.08);
        color: white;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg,#3b82f6,#6366f1);
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: scale(1.02);
    }

    .item {
        padding: 14px;
        border-radius: 14px;
        margin-bottom: 12px;
        background: rgba(255,255,255,0.05);
    }

    .row {
        display: flex;
        gap: 10px;
        margin-top: 10px;
    }

    .btn {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    .plus { background: #10b981; color: white; }
    .minus { background: #ef4444; color: white; }
    .delete { background: #6b7280; color: white; }

    .low {
        color: #f87171;
        font-weight: bold;
    }

    .topbar {
        text-align: center;
        font-size: 14px;
        opacity: 0.7;
        margin-bottom: 10px;
    }
</style>
</head>
<body>

<div class="container">

    <h1>📦 Lagerbestand</h1>
    <div class="subtitle">Deine persönliche Smart-Inventar-App</div>

    <div class="card">
        <input id="name" placeholder="Materialname" />
        <input id="qty" type="number" placeholder="Menge" />
        <input id="min" type="number" placeholder="Mindestbestand" />
        <button onclick="addItem()">+ Material hinzufügen</button>
    </div>

    <div id="list"></div>

</div>

<script>
let items = JSON.parse(localStorage.getItem('items')) || [];

function save() {
    localStorage.setItem('items', JSON.stringify(items));
}

function addItem() {
    const name = document.getElementById('name').value;
    const qty = parseInt(document.getElementById('qty').value);
    const min = parseInt(document.getElementById('min').value);

    if (!name || isNaN(qty) || isNaN(min)) return;

    items.push({ name, qty, min });
    save();
    render();

    document.getElementById('name').value = '';
    document.getElementById('qty').value = '';
    document.getElementById('min').value = '';
}

function updateQty(index, change) {
    items[index].qty += change;
    if (items[index].qty < 0) items[index].qty = 0;
    save();
    render();
}

function deleteItem(index) {
    items.splice(index, 1);
    save();
    render();
}

function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';

    items.forEach((item, index) => {
        const low = item.qty <= item.min;

        list.innerHTML += `
            <div class="item">
                <div style="font-size:18px; font-weight:bold;">
                    ${item.name} ${low ? '⚠️' : ''}
                </div>
                <div>Menge: <b>${item.qty}</b></div>
                <div>Mindest: ${item.min}</div>
                ${low ? '<div class="low">Niedriger Bestand!</div>' : ''}
                <div class="row">
                    <button class="btn plus" onclick="updateQty(${index}, 1)">+1</button>
                    <button class="btn minus" onclick="updateQty(${index}, -1)">-1</button>
                    <button class="btn delete" onclick="deleteItem(${index})">Löschen</button>
                </div>
            </div>
        `;
    });
}

render();
</script>

</body>
</html>
