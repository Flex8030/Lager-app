<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lagerbestand Offline</title>

<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.08);
  --accent:#3b82f6;
  --green:#10b981;
  --red:#ef4444;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Arial;
  background: radial-gradient(circle at top, #1e293b, #020617);
  color:white;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

h1{text-align:center;margin:10px 0}

.card{
  background:var(--card);
  backdrop-filter: blur(12px);
  border-radius:16px;
  padding:12px;
  margin-bottom:12px;
}

input{
  width:100%;
  padding:12px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,0.08);
  color:white;
  outline:none;
}

button{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:var(--accent);
  color:white;
  font-weight:600;
  cursor:pointer;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:10px 0;
}

.tab{
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,0.1);
  cursor:pointer;
  white-space:nowrap;
}

.tab.active{background:var(--accent)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
}

.item{
  background:rgba(255,255,255,0.06);
  padding:12px;
  border-radius:14px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:10px;
}

.small{
  padding:8px;
  border-radius:10px;
  border:none;
  color:white;
  cursor:pointer;
}

.plus{background:var(--green)}
.minus{background:var(--red)}
.plus10{background:#22c55e}
.minus10{background:#dc2626}
.del{background:#6b7280}

.low{color:#f87171;font-weight:600}
.empty{opacity:0.6;text-align:center;padding:20px}
</style>
</head>
<body>

<div class="container">

<h1>📦 Lager (Offline)</h1>

<div class="card">
  <input id="catName" placeholder="Kategorie hinzufügen" />
  <button onclick="addCategory()">+ Kategorie</button>
</div>

<div class="tabs" id="tabs"></div>

<div class="card">
  <input id="name" placeholder="Material" />
  <input id="qty" type="number" placeholder="Menge" />
  <input id="min" type="number" placeholder="Mindestbestand" />
  <button onclick="addItem()">+ Material hinzufügen</button>
</div>

<div id="list" class="grid"></div>

</div>

<script>
let data = JSON.parse(localStorage.getItem('data')) || {categories:[],items:[]};
let activeCat = data.categories[0] || null;

function save(){
  localStorage.setItem('data',JSON.stringify(data));
}

function addCategory(){
  const name = document.getElementById('catName').value.trim();
  if(!name) return;

  if(!data.categories.includes(name)){
    data.categories.push(name);
  }

  activeCat = name;
  save();
  render();
  document.getElementById('catName').value='';
}

function addItem(){
  const name = document.getElementById('name').value.trim();
  const qty = parseInt(document.getElementById('qty').value);
  const min = parseInt(document.getElementById('min').value);

  if(!name || !activeCat || isNaN(qty) || isNaN(min)) return;

  data.items.push({name,qty,min,cat:activeCat});
  save();
  render();

  document.getElementById('name').value='';
  document.getElementById('qty').value='';
  document.getElementById('min').value='';
}

function updateQty(i,delta){
  data.items[i].qty += delta;
  if(data.items[i].qty < 0) data.items[i].qty = 0;
  save();
  render();
}

function deleteItem(i){
  data.items.splice(i,1);
  save();
  render();
}

function selectCat(cat){
  activeCat = cat;
  render();
}

function render(){
  const tabs = document.getElementById('tabs');
  const list = document.getElementById('list');

  tabs.innerHTML='';
  data.categories.forEach(cat=>{
    tabs.innerHTML += `<div class="tab ${cat===activeCat?'active':''}" onclick="selectCat('${cat}')">${cat}</div>`;
  });

  list.innerHTML='';

  const items = data.items.filter(i=>i.cat===activeCat);

  if(items.length===0){
    list.innerHTML = `<div class='empty'>Keine Einträge</div>`;
    return;
  }

  items.forEach(item=>{
    const i = data.items.indexOf(item);
    const low = item.qty <= item.min;

    list.innerHTML += `
    <div class="item">
      <b>${item.name}</b> ${low?'⚠️':''}
      <div>Menge: ${item.qty}</div>
      <div>Min: ${item.min}</div>
      ${low?'<div class="low">Niedrig!</div>':''}

      <div class="row">
        <button class="small plus" onclick="updateQty(${i},1)">+1</button>
        <button class="small minus" onclick="updateQty(${i},-1)">-1</button>
        <button class="small plus10" onclick="updateQty(${i},10)">+10</button>
        <button class="small minus10" onclick="updateQty(${i},-10)">-10</button>
        <button class="small del" onclick="deleteItem(${i})">🗑️</button>
      </div>
    </div>`;
  });
}

render();
</script>

</body>
</html>
